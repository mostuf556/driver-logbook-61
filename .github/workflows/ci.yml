name: CI - Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: public/coverage

      - name: Show coverage summary (if available)
        if: always()
        run: |
          if [ -f public/coverage/coverage-summary.json ]; then
            cat public/coverage/coverage-summary.json
          else
            echo "No coverage summary file found. Check artifacts for coverage directory."
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Ensure artifact directories exist
        run: mkdir -p public/e2e-report public/e2e-results

      - name: Run e2e tests
        continue-on-error: true
        run: npm run test:e2e

      - name: E2E coverage summary
        if: always()
        run: |
          if [ -f public/e2e-results/index.json ]; then
            node -e "
              const m = require('./public/e2e-results/index.json');
              const total = m.tests.length;
              const passed = m.tests.filter(t => t.status === 'passed').length;
              const failed = m.tests.filter(t => t.status !== 'passed').length;
              const pct = total ? Math.round((passed / total) * 100) : 0;
              console.log('E2E coverage: ' + passed + '/' + total + ' passed (' + pct + '%)');
              console.log('Failed: ' + failed);
              for (const t of m.tests) console.log(' - [' + t.status + '] ' + t.title);
            "
          else
            echo 'No e2e manifest produced.'
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/e2e-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright videos & traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: public/e2e-results
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job if e2e tests failed
        if: always()
        run: |
          if [ -f public/e2e-results/index.json ]; then
            status=$(node -e "console.log(require('./public/e2e-results/index.json').status)")
            echo "E2E status: $status"
            if [ "$status" != "passed" ]; then
              echo "E2E tests did not pass (status=$status). See uploaded artifacts."
              exit 1
            fi
          else
            echo "No e2e manifest produced — treating as failure."
            exit 1
          fi
